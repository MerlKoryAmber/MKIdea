# LinuxOps Web — nginx перед сервисом: TLS, 443, WebSocket для Blazor. Кладётся в /etc/nginx/conf.d/linuxops-web.conf.
# Сертификат: /etc/pki/linuxops-web/web.{crt,key} (на стенде — от корневого CA лабы, /root/lab-ca). SELinux: setsebool -P httpd_can_network_connect 1
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/pki/linuxops-web/web.crt;
    ssl_certificate_key /etc/pki/linuxops-web/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
}
